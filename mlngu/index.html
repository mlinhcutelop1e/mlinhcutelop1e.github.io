<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Newsroom</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Header -->
<header>
    <h1>The Newsroom</h1>
    <nav>
        <a href="#">Trang chủ</a>
        <a href="#">Khám phá</a>
        <a href="#">Liên hệ</a>
    </nav>
</header>

<!-- Hero -->
<section id="hero"></section>

<!-- Bài viết -->
<section>
    <h2>Tin mới</h2>
    <div id="articles"></div>
</section>

<script>
// Data mẫu
const articles = [
    {
        id: 1,
        title: "AI đang thay đổi thế giới",
        author: "Admin",
        image: "https://via.placeholder.com/400",
        excerpt: "Công nghệ AI đang phát triển mạnh..."
    },
    {
        id: 2,
        title: "Kinh tế số 2026",
        author: "Linh",
        image: "https://via.placeholder.com/400",
        excerpt: "Xu hướng kinh tế số ngày càng tăng..."
    }
];

// Render hero
function renderHero() {
    const a = articles[0];
    document.getElementById("hero").innerHTML = `
        <h2>${a.title}</h2>
        <img src="${a.image}" width="300">
        <p>${a.excerpt}</p>
    `;
}

// Render list
function renderArticles() {
    const html = articles.map(a => `
        <div>
            <h3>${a.title}</h3>
            <p>${a.excerpt}</p>
            <small>${a.author}</small>
        </div>
    `).join("");

    document.getElementById("articles").innerHTML = html;
}

// Run
renderHero();
renderArticles();
</script>

</body>
</html>
